services:
  # MinIO Server for local development
  minio:
    image: minio/minio:latest
    container_name: files-connect-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DEFAULT_BUCKETS: files-connect-bucket,files-connect-assets
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Redis for job queue
  redis:
    image: redis:7-alpine
    container_name: files-connect-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Zip Worker for processing databank zip jobs
  zip-worker:
    build:
      context: ./workers/zip-worker
      dockerfile: Dockerfile
    container_name: files-connect-zip-worker
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # Redis configuration
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      
      # Storage configuration (MinIO for local development)
      STORAGE_PROVIDER: minio
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET_NAME: files-connect-bucket
      USE_SSL: "false"
      
      # CAT API configuration (optional - update with your values)
      # CAT_URL: http://your-cat-api-url
      # CAT_USERNAME: your-username
      # CAT_PASSWORD: your-password
    restart: unless-stopped
    # For development, can run multiple workers by scaling:
    # docker-compose up -d --scale zip-worker=3

  # Readiness Worker for processing data readiness assessment jobs
  readiness-worker:
    build:
      context: ./workers/readiness-worker
      dockerfile: Dockerfile.worker
    container_name: files-connect-readiness-worker
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # Redis configuration
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      READINESS_QUEUE_NAME: jobs:readiness
      
      # Storage configuration (MinIO for local development)
      STORAGE_PROVIDER: minio
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET_NAME: files-connect-bucket
      S3_REPORTS_BUCKET_NAME: files-connect-bucket
      USE_SSL: "false"
      
      # OpenAI API configuration (required for column/role inference)
      # OPENAI_API_KEY: ${OPENAI_API_KEY}
      
      # Elastic/CAT API configuration (optional - for updating readiness scores)
      # ELASTIC_ID: your-elastic-id
      # ELASTIC_PASS: your-elastic-password
    restart: unless-stopped
    # For development, can run multiple workers by scaling:
    # docker-compose up -d --scale readiness-worker=2

