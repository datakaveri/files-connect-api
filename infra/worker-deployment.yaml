apiVersion: apps/v1
kind: Deployment
metadata:
  name: zip-worker
  # Same namespace as files-connect-config / files-connect-secret and the redis Service -
  # ConfigMaps and Secrets cannot be referenced across namespaces.
  namespace: sandbox
  labels:
    app: zip-worker
    component: job-processor
spec:
  replicas: 2  # Scale based on workload
  selector:
    matchLabels:
      app: zip-worker
  template:
    metadata:
      labels:
        app: zip-worker
        component: job-processor
    spec:
      containers:
      - name: zip-worker
        image: your-registry/files-connect-zip-worker:latest  # Update with your image
        imagePullPolicy: Always
        env:
        # Field reference: docs/config/zip-worker.md
        # Redis configuration - must match the file server's, including REDIS_DB
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: files-connect-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: files-connect-config
              key: REDIS_PORT
        - name: REDIS_DB
          valueFrom:
            configMapKeyRef:
              name: files-connect-config
              key: REDIS_DB
        - name: REDIS_CLUSTER_MODE
          valueFrom:
            configMapKeyRef:
              name: files-connect-config
              key: REDIS_CLUSTER_MODE
              optional: true
        - name: ZIP_QUEUE_NAME
          valueFrom:
            configMapKeyRef:
              name: files-connect-config
              key: ZIP_QUEUE_NAME
        # Redis password (only when the server enforces AUTH; keep in sync with the file server)
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: files-connect-secret
              key: REDIS_PASSWORD
              optional: true

        # Storage configuration - from ConfigMap. The worker reads the legacy S3_*
        # names, so the STORAGE_* keys are remapped here.
        - name: STORAGE_PROVIDER
          valueFrom:
            configMapKeyRef:
              name: files-connect-config
              key: STORAGE_PROVIDER
        - name: S3_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: files-connect-config
              key: STORAGE_ENDPOINT
        - name: BUCKET_NAME
          valueFrom:
            configMapKeyRef:
              name: files-connect-config
              key: BUCKET_NAME
        - name: S3_REGION
          valueFrom:
            configMapKeyRef:
              name: files-connect-config
              key: STORAGE_REGION
              optional: true
        - name: USE_SSL
          valueFrom:
            configMapKeyRef:
              name: files-connect-config
              key: STORAGE_USE_SSL
        # Set S3_VERIFY_SSL to "false" when storage uses self-signed/private CA (e.g. fs-prod.s3.cyfuture.cloud)
        - name: S3_VERIFY_SSL
          valueFrom:
            configMapKeyRef:
              name: files-connect-config
              key: S3_VERIFY_SSL
              optional: true

        # Storage credentials - from Secret
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: files-connect-secret
              key: STORAGE_ACCESS_KEY
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: files-connect-secret
              key: STORAGE_SECRET_KEY

        # GCS credentials (only used when STORAGE_PROVIDER is "gcs"; optional so
        # this manifest still applies when the keys aren't defined)
        - name: GCS_PROJECT_ID
          valueFrom:
            configMapKeyRef:
              name: files-connect-config
              key: GCS_PROJECT_ID
              optional: true
        - name: GCS_KEY_FILE
          valueFrom:
            configMapKeyRef:
              name: files-connect-config
              key: GCS_KEY_FILE
              optional: true
        - name: GCS_CLIENT_EMAIL
          valueFrom:
            secretKeyRef:
              name: files-connect-secret
              key: GCS_CLIENT_EMAIL
              optional: true
        - name: GCS_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: files-connect-secret
              key: GCS_PRIVATE_KEY
              optional: true

        # Catalogue index update (optional). CAT_URL is the ELASTICSEARCH base URL,
        # not the catalogue REST API: the worker calls {CAT_URL}/tgdex__cat/_search
        # and _update. Pointing it at CAT_API_URL makes every update 404 while the
        # zip job still reports success. See docs/config/zip-worker.md.
        - name: CAT_URL
          valueFrom:
            configMapKeyRef:
              name: files-connect-config
              key: ELASTICSEARCH_URL
              optional: true
        - name: CAT_USERNAME
          valueFrom:
            secretKeyRef:
              name: files-connect-secret
              key: CAT_USERNAME
              optional: true
        - name: CAT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: files-connect-secret
              key: CAT_PASSWORD
              optional: true

        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"

      # Graceful shutdown configuration - must exceed the longest single zip job
      terminationGracePeriodSeconds: 60

      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      # Restart policy
      restartPolicy: Always
---
# Horizontal Pod Autoscaler (optional - for auto-scaling workers)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: zip-worker-hpa
  namespace: sandbox
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: zip-worker
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # Wait 5 minutes before scaling down
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0  # Scale up immediately
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
