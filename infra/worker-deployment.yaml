apiVersion: apps/v1
kind: Deployment
metadata:
  name: zip-worker
  namespace: default
  labels:
    app: zip-worker
    component: job-processor
spec:
  replicas: 2  # Scale based on workload
  selector:
    matchLabels:
      app: zip-worker
  template:
    metadata:
      labels:
        app: zip-worker
        component: job-processor
    spec:
      containers:
      - name: zip-worker
        image: your-registry/files-connect-zip-worker:latest  # Update with your image
        imagePullPolicy: Always
        env:
        # Redis configuration
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_DB
          value: "0"
        # Redis password (if using authentication)
        # - name: REDIS_PASSWORD
        #   valueFrom:
        #     secretKeyRef:
        #       name: redis-secret
        #       key: password
        
        # Storage configuration - from ConfigMap
        - name: STORAGE_PROVIDER
          valueFrom:
            configMapKeyRef:
              name: files-connect-config
              key: STORAGE_PROVIDER
        - name: S3_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: files-connect-config
              key: STORAGE_ENDPOINT
        - name: S3_BUCKET_NAME
          valueFrom:
            configMapKeyRef:
              name: files-connect-config
              key: BUCKET_NAME
        - name: S3_REGION
          valueFrom:
            configMapKeyRef:
              name: files-connect-config
              key: STORAGE_REGION
              optional: true
        - name: USE_SSL
          valueFrom:
            configMapKeyRef:
              name: files-connect-config
              key: STORAGE_USE_SSL
        # Set S3_VERIFY_SSL to "false" when storage uses self-signed/private CA (e.g. fs-prod.s3.cyfuture.cloud)
        - name: S3_VERIFY_SSL
          valueFrom:
            configMapKeyRef:
              name: files-connect-config
              key: S3_VERIFY_SSL
              optional: true
        
        # Storage credentials - from Secret
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: files-connect-secret
              key: STORAGE_ACCESS_KEY
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: files-connect-secret
              key: STORAGE_SECRET_KEY
        
        # CAT API configuration (optional)
        - name: CAT_URL
          valueFrom:
            configMapKeyRef:
              name: files-connect-config
              key: CAT_API_URL
              optional: true
        - name: CAT_USERNAME
          valueFrom:
            secretKeyRef:
              name: files-connect-secret
              key: CAT_USERNAME
              optional: true
        - name: CAT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: files-connect-secret
              key: CAT_PASSWORD
              optional: true
        
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        
      # Graceful shutdown configuration
      terminationGracePeriodSeconds: 60
      
      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      
      # Restart policy
      restartPolicy: Always
---
# Horizontal Pod Autoscaler (optional - for auto-scaling workers)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: zip-worker-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: zip-worker
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # Wait 5 minutes before scaling down
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0  # Scale up immediately
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30

