# EXAMPLE ONLY: copy to ignored infra/configmap.local.yaml and customize before applying.
# All *.example.com endpoints and the bucket/role values below are illustrative.
apiVersion: v1
kind: ConfigMap
metadata:
  name: files-connect-config
  namespace: sandbox
data:
  # Field-by-field reference: docs/config/file-server.md
  # Non-secret values only. Credentials belong in infra/secret.yaml.

  # ---- Server ----
  PORT: "3000"
  NODE_ENV: "production"
  VERSION: "1.0.0"
  CORS_ORIGIN: "https://app.example.com"  # align with your ingress allow-list
  LOG_LEVEL: "info"         # use "debug" only while diagnosing; it logs per-request context

  # ---- Auth ----
  AUTH_ENABLED: "true"      # NEVER "false" in a deployed environment
  AUTHZ_ENABLED: "true"
  KEYCLOAK_AUTH_URL: "https://idp.example.com/realms/example"
  KEYCLOAK_CLIENT_ID: "files-connect-client"
  # Multi-IDP JWKS verification. When set it replaces the static KEYCLOAK_PUBLIC_KEY
  # in files-connect-secret. Keys must equal the token "iss" claim verbatim.
  # ISSUER_CONFIG: '{"jwtIgnoreExpiry":false,"leeway":30,"jwksRefreshIntervalMs":21600000,"https://idp.example.com/realms/example":{"type":"remote","jwksUrl":"https://idp.example.com/realms/example/protocol/openid-connect/certs","audience":["files-connect-client"]}}'

  # ---- Downstream services ----
  ACL_APD_API_URL: "https://acl.example.com/dx/apd/acl/v1"   # no trailing slash: paths are concatenated
  CAT_API_URL: "https://catalogue.example.com/iudx/v2/cat"  # catalogue REST API (NOT Elasticsearch)

  # ---- Storage ----
  STORAGE_PROVIDER: "s3"
  STORAGE_ENDPOINT: "https://s3.ap-south-1.amazonaws.com"
  STORAGE_REGION: "ap-south-1"
  STORAGE_USE_SSL: "true"
  STORAGE_FORCE_PATH_STYLE: "false"   # "true" for MinIO and most S3-compatible providers
  BUCKET_NAME: "your-files-connect-bucket"
  MAX_SIZE_IN_MULTIPART_UPLOAD_IN_GB: "5"
  # Legacy names consumed by the Python workers; the worker Deployments remap
  # STORAGE_ENDPOINT/STORAGE_REGION/STORAGE_USE_SSL onto S3_ENDPOINT/S3_REGION/USE_SSL.
  # Keep verification enabled. Install your private CA rather than disabling TLS verification.
  # Read by the workers only - the file server has no equivalent knob.
  # S3_VERIFY_SSL: "false"
  # GCS configuration (only when STORAGE_PROVIDER is "gcs"; GCS_KEY_FILE additionally
  # requires a Secret volume mounted at that path in each Deployment)
  # GCS_PROJECT_ID: "<gcp-project-id>"
  # GCS_KEY_FILE: "/var/secrets/gcs/key.json"

  # ---- Redis / job queues (shared with both workers) ----
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  REDIS_CLUSTER_MODE: "false"
  ZIP_QUEUE_NAME: "jobs:zip"
  REPORT_QUEUE_NAME: "jobs:report"

  # ---- Catalogue index (Elasticsearch) - used by the workers, not the file server ----
  # Cluster origin only, no index and no path. The zip worker receives this same value
  # as CAT_URL; the report worker as ELASTICSEARCH_URL. Without it, readiness scores and
  # dataUploadStatus are never written back to the catalogue (jobs still report success).
  # ELASTICSEARCH_URL: "https://<elasticsearch-host>:9200"
  ELASTIC_CAT_INDEX: "tgdex__cat"
  # "true" publishes the dataset (publishStatus=ACTIVE) when a readiness report completes.
  # Set "false" for deployments that manage publishStatus elsewhere (e.g. maha).
  CAT_SET_PUBLISH_STATUS: "true"

  # ---- STS temporary access ----
  # Replace the illustrative account id and role with your deployment's ARN - see infra/STS_SETUP.md
  STS_ROLE_ARN: "arn:aws:iam::123456789012:role/DatabanksTemporaryAccessRole"
  STS_SESSION_DURATION_IN_SECONDS: "900"

  # ---- Observability ----
  # The elastic-apm-node agent is preloaded by the image CMD and is active by default,
  # targeting http://127.0.0.1:8200. Keep it off unless an APM Server exists.
  ELASTIC_APM_ACTIVE: "false"
  # ELASTIC_APM_SERVICE_NAME: "files-connect-api"
  # ELASTIC_APM_ENVIRONMENT: "production"
  # ELASTIC_APM_SERVER_URL: "https://<apm-server>:8200"
  # ELASTIC_APM_API_KEY belongs in files-connect-secret, not here.

  # ---- Client-side encryption (opt-in deployments only) ----
  # ENCRYPTION_ENABLED: "true"
  # KMS_KEY_VERSION_NAME: "projects/<p>/locations/<l>/keyRings/<r>/cryptoKeys/<k>/cryptoKeyVersions/<n>"
