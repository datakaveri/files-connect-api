apiVersion: v1
kind: ConfigMap
metadata:
  name: files-connect-config
  namespace: sandbox
data:
  PORT: "3000"
  NODE_ENV: "production"
  S3_ENDPOINT: "https://s3.ap-south-1.amazonaws.com"
  S3_REGION: "ap-south-1"
  BUCKET_NAME: "s3-ap-south-1-tgdex-production"
  MAX_SIZE_IN_MULTIPART_UPLOAD_IN_GB: "1000"
  CORS_ORIGIN: "*"
  LOG_LEVEL: "debug"
  KEYCLOAK_AUTH_URL: "https://idp.tgdex.telangana.gov.in/auth/realms/tgdex"
  KEYCLOAK_REALM: "tgdex"
  KEYCLOAK_CLIENT_ID: "angular-tgdex-client"
  ACL_APD_API_URL: "https://acl-apd.tgdex.telangana.gov.in/dx/apd/acl/v1/"
  ZIP_LAMBDA_URL: "https://gl6qmqp7ii5emmcdtqcxy2lihu0ddmjp.lambda-url.ap-south-1.on.aws/"
  LAMBDA_REGION: "ap-south-1"
  CAT_API_URL: "https://v2.dev.controlplane.iudx.io/iudx/v2/cat"
  REPORTS_LAMBDA_URL: "https://a6tttymcoyytfod7umoabkxsc40blzhi.lambda-url.ap-south-1.on.aws/"
  # Redis configuration for job queue
  # Redis Sentinel (HA) — point at the redis-ha service and enable sentinel.
  # Confirm the master name with: redis-cli -p 26379 sentinel masters
  REDIS_HOST: "redis-redis-ha.redis.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  REDIS_SENTINEL_ENABLED: "true"
  REDIS_SENTINEL_MASTER_NAME: "mymaster"
  # Optional explicit sentinel list; when omitted, defaults to ${REDIS_HOST}:26379
  # REDIS_SENTINEL_HOSTS: "redis-redis-ha.redis.svc.cluster.local:26379"
  ZIP_QUEUE_NAME: "jobs:zip"
  REPORT_QUEUE_NAME: "jobs:report"
  # Storage provider configuration
  STORAGE_PROVIDER: "s3"
  STORAGE_ENDPOINT: "https://s3.ap-south-1.amazonaws.com"
  STORAGE_REGION: "ap-south-1"
  STORAGE_USE_SSL: "true"
  # Set to "false" when storage uses self-signed/private CA (e.g. fs-prod.s3.cyfuture.cloud). Omit or "true" for normal verification.
  # S3_VERIFY_SSL: "false"
  # GCS configuration (only used when STORAGE_PROVIDER is "gcs"; must also be wired
  # into worker-deployment.yaml / report-worker-deployment.yaml, not just the main API)
  # GCS_PROJECT_ID: "<gcp-project-id>"
  # GCS_KEY_FILE: "/var/secrets/gcs/key.json"
  # STS configuration for temporary access
  STS_ROLE_ARN: "arn:aws:iam::123456789012:role/DatabanksTemporaryAccessRole"
  STS_SESSION_DURATION_IN_SECONDS: "900"
