apiVersion: v1
kind: Secret
metadata:
  name: files-connect-secret
  namespace: sandbox
type: Opaque
stringData:
  # Storage credentials (S3 / MinIO)
  S3_ACCESS_KEY: <S3_ACCESS_KEY>
  S3_SECRET_KEY: <S3_SECRET_KEY>
  STORAGE_ACCESS_KEY: <STORAGE_ACCESS_KEY>
  STORAGE_SECRET_KEY: <STORAGE_SECRET_KEY>

  # Storage credentials (GCS only - omit if STORAGE_PROVIDER is not "gcs";
  # not needed at all if relying on Application Default Credentials)
  # GCS_CLIENT_EMAIL: <GCS_CLIENT_EMAIL>
  # GCS_PRIVATE_KEY: <GCS_PRIVATE_KEY>
  
  # Keycloak
  KEYCLOAK_PUBLIC_KEY: <KEYCLOAK_PUBLIC_KEY>
  
  # Lambda credentials (optional - for backward compatibility)
  LAMBDA_ACCESS_KEY: <LAMBDA_ACCESS_KEY>
  LAMBDA_SECRET_KEY: <LAMBDA_SECRET_KEY>
  
  # CAT API credentials (optional - for worker)
  CAT_USERNAME: <CAT_USERNAME>
  CAT_PASSWORD: <CAT_PASSWORD>

---

apiVersion: v1
kind: Secret
metadata:
  name: report-worker-secret
  namespace: sandbox
type: Opaque
stringData:
  # Required for report-worker (column/role inference)
  OPENAI_API_KEY: <OPENAI_API_KEY>

---

apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secrets
  namespace: rabbitmq-secrets 
type: Opaque
stringData:
  RABBITMQ_HOST: <RABBITMQ_HOST>
  RABBITMQ_PORT: <RABBITMQ_PORT>
  RABBITMQ_VHOST: <RABBITMQ_VHOST>
  RABBITMQ_USERNAME: <RABBITMQ_USERNAME>
  RABBITMQ_PASSWORD: <RABBITMQ_PASSWORD>
  RABBITMQ_EXCHANGE: <RABBITMQ_EXCHANGE>
  RABBITMQ_ROUTING_KEY: <RABBITMQ_ROUTING_KEY>
  
