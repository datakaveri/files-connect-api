apiVersion: v1
kind: ConfigMap
metadata:
  name: files-connect-api-config
  namespace: sandbox
data:
  PORT: "3000"
  NODE_ENV: "production"
  S3_ENDPOINT: "https://s3.ap-south-1.amazonaws.com"
  S3_REGION: "ap-south-1"
  BUCKET_NAME: "s3-ap-south-1-test-tgdex"
  ASSET_BUCKET_NAME: "s3-ap-south-1-tgdex-assets"
  MAX_SIZE_IN_MULTIPART_UPLOAD_IN_GB: "1000"
  CORS_ORIGIN: "*"
  LOG_LEVEL: "debug"
  KEYCLOAK_URL: "https://idp.tgdex.telangana.gov.in/auth/realms/tgdex"
  KEYCLOAK_REALM: "tgdex"
  KEYCLOAK_CLIENT_ID: "angular-tgdex-client"

