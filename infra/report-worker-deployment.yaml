apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-worker
  namespace: sandbox
  labels:
    app: report-worker
    component: job-processor
spec:
  replicas: 4
  selector:
    matchLabels:
      app: report-worker
  template:
    metadata:
      labels:
        app: report-worker
        component: job-processor
    spec:
      containers:
      - name: report-worker
        image: your-registry/files-connect-report-worker:latest  # Update with your image
        imagePullPolicy: Always
        env:
        # Field reference: docs/config/report-worker.md
        # Redis configuration - must match the file server's, including REDIS_DB
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: files-connect-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: files-connect-config
              key: REDIS_PORT
        - name: REDIS_DB
          valueFrom:
            configMapKeyRef:
              name: files-connect-config
              key: REDIS_DB
        - name: REDIS_CLUSTER_MODE
          valueFrom:
            configMapKeyRef:
              name: files-connect-config
              key: REDIS_CLUSTER_MODE
              optional: true
        - name: REPORT_QUEUE_NAME
          valueFrom:
            configMapKeyRef:
              name: files-connect-config
              key: REPORT_QUEUE_NAME
        # Redis password (only when the server enforces AUTH; keep in sync with the file server)
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: files-connect-secret
              key: REDIS_PASSWORD
              optional: true

        # Storage configuration - from ConfigMap. The worker reads the legacy S3_*
        # names, so the STORAGE_* keys are remapped here.
        - name: STORAGE_PROVIDER
          valueFrom:
            configMapKeyRef:
              name: files-connect-config
              key: STORAGE_PROVIDER
        - name: S3_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: files-connect-config
              key: STORAGE_ENDPOINT
        - name: BUCKET_NAME
          valueFrom:
            configMapKeyRef:
              name: files-connect-config
              key: BUCKET_NAME
        - name: S3_REGION
          valueFrom:
            configMapKeyRef:
              name: files-connect-config
              key: STORAGE_REGION
              optional: true
        - name: USE_SSL
          valueFrom:
            configMapKeyRef:
              name: files-connect-config
              key: STORAGE_USE_SSL
        - name: S3_VERIFY_SSL
          valueFrom:
            configMapKeyRef:
              name: files-connect-config
              key: S3_VERIFY_SSL
              optional: true

        # Storage credentials - from Secret
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: files-connect-secret
              key: STORAGE_ACCESS_KEY
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: files-connect-secret
              key: STORAGE_SECRET_KEY

        # GCS credentials (only used when STORAGE_PROVIDER is "gcs"; optional so
        # this manifest still applies when the keys aren't defined)
        - name: GCS_PROJECT_ID
          valueFrom:
            configMapKeyRef:
              name: files-connect-config
              key: GCS_PROJECT_ID
              optional: true
        - name: GCS_KEY_FILE
          valueFrom:
            configMapKeyRef:
              name: files-connect-config
              key: GCS_KEY_FILE
              optional: true
        - name: GCS_CLIENT_EMAIL
          valueFrom:
            secretKeyRef:
              name: files-connect-secret
              key: GCS_CLIENT_EMAIL
              optional: true
        - name: GCS_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: files-connect-secret
              key: GCS_PRIVATE_KEY
              optional: true

        # Catalogue REST API - dataset name resolution in readiness reports.
        # Without it the code falls back to a hard-coded dev URL and reports get the
        # wrong dataset name while still reporting success.
        - name: CAT_API_URL
          valueFrom:
            configMapKeyRef:
              name: files-connect-config
              key: CAT_API_URL

        # Catalogue index (Elasticsearch) - where the readiness score is written back.
        # Unset ELASTICSEARCH_URL means reports are generated but the catalogue is
        # never updated (logged at WARN, job still succeeds).
        - name: ELASTICSEARCH_URL
          valueFrom:
            configMapKeyRef:
              name: files-connect-config
              key: ELASTICSEARCH_URL
              optional: true
        - name: ELASTIC_CAT_INDEX
          valueFrom:
            configMapKeyRef:
              name: files-connect-config
              key: ELASTIC_CAT_INDEX
              optional: true
        # "true" also sets publishStatus=ACTIVE when a report completes.
        - name: CAT_SET_PUBLISH_STATUS
          valueFrom:
            configMapKeyRef:
              name: files-connect-config
              key: CAT_SET_PUBLISH_STATUS
              optional: true
        - name: ELASTIC_ID
          valueFrom:
            secretKeyRef:
              name: report-worker-secret
              key: ELASTIC_ID
              optional: true
        - name: ELASTIC_PASS
          valueFrom:
            secretKeyRef:
              name: report-worker-secret
              key: ELASTIC_PASS
              optional: true

        # OpenAI API key - from Secret (report-worker-secret)
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: report-worker-secret
              key: OPENAI_API_KEY

        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"

      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      restartPolicy: Always
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: report-worker-hpa
  namespace: sandbox
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: report-worker
  minReplicas: 4
  maxReplicas: 12
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
