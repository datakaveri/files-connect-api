apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-worker
  namespace: sandbox
  labels:
    app: report-worker
    component: job-processor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: report-worker
  template:
    metadata:
      labels:
        app: report-worker
        component: job-processor
    spec:
      containers:
      - name: report-worker
        image: your-registry/files-connect-report-worker:latest  # Update with your image
        imagePullPolicy: Always
        env:
        # Redis configuration
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: files-connect-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: files-connect-config
              key: REDIS_PORT
        - name: REDIS_DB
          valueFrom:
            configMapKeyRef:
              name: files-connect-config
              key: REDIS_DB
        - name: READINESS_QUEUE_NAME
          value: "jobs:report"

        # Storage configuration - from ConfigMap
        - name: STORAGE_PROVIDER
          valueFrom:
            configMapKeyRef:
              name: files-connect-config
              key: STORAGE_PROVIDER
        - name: S3_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: files-connect-config
              key: STORAGE_ENDPOINT
        - name: BUCKET_NAME
          valueFrom:
            configMapKeyRef:
              name: files-connect-config
              key: BUCKET_NAME
        - name: DATAREADINESS_BUCKET
          valueFrom:
            configMapKeyRef:
              name: files-connect-config
              key: DATAREADINESS_BUCKET
        - name: S3_REGION
          valueFrom:
            configMapKeyRef:
              name: files-connect-config
              key: STORAGE_REGION
              optional: true
        - name: USE_SSL
          valueFrom:
            configMapKeyRef:
              name: files-connect-config
              key: STORAGE_USE_SSL
        - name: S3_VERIFY_SSL
          valueFrom:
            configMapKeyRef:
              name: files-connect-config
              key: S3_VERIFY_SSL
              optional: true

        # Storage credentials - from Secret
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: files-connect-secret
              key: STORAGE_ACCESS_KEY
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: files-connect-secret
              key: STORAGE_SECRET_KEY

        # Catalogue API URL (required for dataset name resolution in readiness reports)
        - name: CAT_API_URL
          valueFrom:
            configMapKeyRef:
              name: files-connect-config
              key: CAT_API_URL

        # OpenAI API key - from Secret (report-worker-secret)
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: report-worker-secret
              key: OPENAI_API_KEY

        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"

      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      restartPolicy: Always
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: report-worker-hpa
  namespace: sandbox
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: report-worker
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
