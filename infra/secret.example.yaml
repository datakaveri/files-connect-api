# TEMPLATE ONLY: copy to ignored infra/secret.yaml, replace every placeholder,
# and apply only the private copy. Never commit populated Secrets.
# Prefer a secret manager / workload identity instead of long-lived keys.
apiVersion: v1
kind: Secret
metadata:
  name: files-connect-secret
  namespace: sandbox
type: Opaque
stringData:
  # Privileges required for each credential: docs/config/file-server.md section 3.

  # Storage credentials (S3 / MinIO). STORAGE_* is what the file server reads;
  # the worker Deployments remap the same pair onto S3_ACCESS_KEY / S3_SECRET_KEY.
  # Needs object CRUD + multipart on BUCKET_NAME, and sts:AssumeRole on STS_ROLE_ARN.
  STORAGE_ACCESS_KEY: <STORAGE_ACCESS_KEY>
  STORAGE_SECRET_KEY: <STORAGE_SECRET_KEY>

  # Storage credentials (GCS only - omit if STORAGE_PROVIDER is not "gcs";
  # not needed at all if relying on Application Default Credentials)
  # GCS_CLIENT_EMAIL: <GCS_CLIENT_EMAIL>
  # GCS_PRIVATE_KEY: <GCS_PRIVATE_KEY>

  # Keycloak static verification key (RS256 public key from Realm settings -> Keys).
  # Required only when ISSUER_CONFIG is not set in files-connect-config.
  KEYCLOAK_PUBLIC_KEY: <KEYCLOAK_PUBLIC_KEY>

  # Redis AUTH - set only when the server enforces requirepass/ACL.
  # Must also be wired into both worker Deployments.
  # REDIS_PASSWORD: <REDIS_PASSWORD>

  # Elasticsearch account used by the ZIP worker to update dataUploadStatus/fileSize
  # on the catalogue index. Same account as ELASTIC_ID/ELASTIC_PASS in
  # report-worker-secret; needs read + write on ELASTIC_CAT_INDEX. Rotate together.
  CAT_USERNAME: <CAT_USERNAME>
  CAT_PASSWORD: <CAT_PASSWORD>

  # Elastic APM ingest key - only when ELASTIC_APM_ACTIVE is "true"
  # ELASTIC_APM_API_KEY: <ELASTIC_APM_API_KEY>

---

apiVersion: v1
kind: Secret
metadata:
  name: report-worker-secret
  namespace: sandbox
type: Opaque
stringData:
  # Required for unstructured metadata inference (external provider: OpenAI).
  # Structured column-role inference is currently disabled in this branch.
  OPENAI_API_KEY: <OPENAI_API_KEY>

  # Elasticsearch account used to write dataReadiness / publishStatus back to the
  # catalogue index. Needs read + write on ELASTIC_CAT_INDEX.
  ELASTIC_ID: <ELASTIC_ID>
  ELASTIC_PASS: <ELASTIC_PASS>

---

apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secrets
  # Must live in the SAME namespace as the Deployment that consumes it - Secrets
  # are namespaced and files-connect-api mounts this one via envFrom.
  namespace: sandbox
type: Opaque
stringData:
  RABBITMQ_HOST: <RABBITMQ_HOST>          # hostname only, no scheme
  RABBITMQ_PORT: <RABBITMQ_PORT>          # 5672 (amqp) / 5671 (amqps)
  RABBITMQ_VHOST: <RABBITMQ_VHOST>
  RABBITMQ_USERNAME: <RABBITMQ_USERNAME>  # needs write permission on RABBITMQ_EXCHANGE only
  RABBITMQ_PASSWORD: <RABBITMQ_PASSWORD>
  RABBITMQ_EXCHANGE: <RABBITMQ_EXCHANGE>  # must already exist; the service does not declare it
  RABBITMQ_ROUTING_KEY: <RABBITMQ_ROUTING_KEY>  # must match the audit consumer's binding key
