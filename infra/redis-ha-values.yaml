# Values for dandydev/redis-ha.
#
# Install example:
#   helm repo add dandydev https://dandydeveloper.github.io/charts
#   helm upgrade --install redis-ha dandydev/redis-ha \
#     --namespace sandbox \
#     -f infra/redis-ha-values.yaml

auth: true
existingSecret: files-connect-secret
authKey: REDIS_PASSWORD

haproxy:
  enabled: true
  replicas: 3
  service:
    type: ClusterIP
  servicePort: 6379

persistentVolume:
  enabled: true
  size: 10Gi

replicas: 3

redis:
  port: 6379
  masterGroupName: mymaster
